name: Build instructor solutions-bb

on:
  push:
    branches: [main]
    paths:
      - ".github/build_bb_artifacts.py"
      - ".github/workflows/build-solutions-bb.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy pillow weasyprint

      - name: Build solutions-bb
        run: python .github/build_bb_artifacts.py

      - name: Commit generated instructor solutions
        run: |
          if [ -z "$(git status --porcelain -- pages/solutions-bb)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/solutions-bb
          git commit -m "Generate instructor solutions-bb"
          git push
